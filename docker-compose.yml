# Môi trường dev của WorkCal: SQL Server, Redis, Seq.
#   Copy-Item .env.example .env   # rồi đổi mật khẩu trong .env
#   docker compose up -d
#   docker compose ps             # đợi cả 3 service báo healthy
# Mọi cổng chỉ mở cho 127.0.0.1. Service sql-mcp thêm ở task P0-07.
name: workcal

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: workcal-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Thiếu MSSQL_SA_PASSWORD trong .env}"
    ports:
      # 14330 để không đụng SQL Server cài sẵn trên máy (1433)
      - "127.0.0.1:14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:8
    container_name: workcal-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Thiếu REDIS_PASSWORD trong .env}"]
    environment:
      # Chỉ để healthcheck dùng redis-cli
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  seq:
    image: datalust/seq:2026
    container_name: workcal-seq
    environment:
      ACCEPT_EULA: "Y"
      # Chỉ dùng khi khởi tạo lần đầu; Seq bắt đổi mật khẩu ở lần đăng nhập đầu tiên
      SEQ_FIRSTRUN_ADMINPASSWORD: "${SEQ_ADMIN_PASSWORD:?Thiếu SEQ_ADMIN_PASSWORD trong .env}"
    ports:
      # Giao diện web và cổng nhận log đều ở http://localhost:5341
      - "127.0.0.1:5341:80"
    volumes:
      - seq-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  sqlserver-data:
  redis-data:
  seq-data:
