# Dependabot: mỗi thứ Hai mở PR nâng version, gộp theo nhóm để ít PR.
# Tiêu đề PR theo Conventional Commits: build(deps): ... hoặc ci(deps): ...
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      test:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]
      maui:
        patterns: ["Microsoft.Maui.*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Ho_Chi_Minh
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Ho_Chi_Minh
    commit-message:
      prefix: build
      include: scope
