# CI của WorkCal: build + test cả solution, kiểm tra README, kiểm tra commit.
# Ba job build-test, check-readme, commitlint là status check bắt buộc của nhánh main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Lần push mới hủy lượt chạy cũ còn dở trên cùng nhánh/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Cho phép build project WPF (net10.0-windows) trên Linux
      EnableWindowsTargeting: true
    steps:
      - uses: actions/checkout@v6

      - name: Cài .NET SDK theo global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cài workload MAUI Android
        run: dotnet workload install maui-android

      - name: Cài Android SDK cho project Mobile
        run: >-
          dotnet build src/Clients/WorkCal.Mobile -t:InstallAndroidDependencies -f net10.0-android
          "-p:AndroidSdkDirectory=$ANDROID_SDK_ROOT" -p:AcceptAndroidSDKLicenses=True

      - name: Restore
        run: dotnet restore WorkCal.slnx

      - name: Build (cảnh báo là lỗi)
        run: dotnet build WorkCal.slnx --no-restore -c Release

      - name: Test
        run: dotnet test WorkCal.slnx --no-build -c Release --logger trx --results-directory TestResults

      - name: Lưu kết quả test
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  check-readme:
    name: check-readme
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Mọi thư mục có README.md với mục '## Mục đích'
        shell: pwsh
        run: ./scripts/check-readme.ps1

  commitlint:
    name: commitlint
    # Chỉ kiểm tra commit trong PR; bỏ qua PR của Dependabot (message do Dependabot sinh, không có Refs:)
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Commit trong PR theo Conventional Commits, có footer Refs"
        uses: wagoid/commitlint-github-action@v6

      # Squash merge lấy tiêu đề PR làm tiêu đề commit trên main, nên tiêu đề PR cũng phải đúng mẫu
      - name: Tiêu đề PR theo Conventional Commits
        shell: pwsh
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          $pattern = '^(feat|fix|docs|test|refactor|perf|style|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: \S.*$'
          if ($env:PR_TITLE -cnotmatch $pattern) {
            Write-Host "::error::Tiêu đề PR '$($env:PR_TITLE)' không đúng mẫu '<loai>(<pham-vi>): <mô tả>'"
            exit 1
          }
          Write-Host "OK: $($env:PR_TITLE)"
